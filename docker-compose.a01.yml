# A01: ISOLATED, disposable staging stack. Never uses a host MariaDB connection.
# Always run with the per-session `evemu-a01-<token>` Compose project generated
# by tools/staging/a01.py; do not use the production docker-compose.yml.
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: evemu
      MARIADB_USER: evemu
      MARIADB_PASSWORD: evemu-a01-local-only
    volumes:
      - a01_database:/var/lib/mysql
    # Deliberately no host port: only the staging server and docker exec can
    # access this database. The network and volume belong to a unique project.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: "no"

  server:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile
    image: evemu-a01-server:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARIADB_HOST: db
      MARIADB_PORT: "3306"
      MARIADB_USER: evemu
      MARIADB_PASSWORD: evemu-a01-local-only
      MARIADB_DATABASE: evemu
      SEED_MARKET: "FALSE"
      RUN_WITH_GDB: "FALSE"
    volumes:
      - a01_config:/app/etc
      - a01_cache:/app/server_cache
      - a01_images:/app/image_cache
    # Client connectivity from this machine only, never public interfaces.
    ports:
      - "127.0.0.1:26000:26000"
      - "127.0.0.1:26001:26001"
    restart: "no"

volumes:
  a01_database: {}
  a01_config: {}
  a01_cache: {}
  a01_images: {}
