services:
  server:
    image: "evemu_server"
    build: . #Build image from source repository
    container_name: server
    volumes:
      - ./config:/app/etc
      - server_cache:/app/server_cache
      - image_cache:/app/image_cache
    ports:
      - "26000:26000"
      - "26001:26001"
    depends_on:
      - db
    links:
      - "db"
    environment:
      MARIADB_HOST: db
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE:-evemu}
      MARIADB_USER: ${MARIADB_USER:-evemu}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
      SEED_MARKET: ${SEED_MARKET:-FALSE}
      SEED_SATURATION: ${SEED_SATURATION:-80}
      SEED_REGIONS: ${SEED_REGIONS:-Derelik,The Citadel,The Forge,Essence}

  db:
    image: "mariadb:12.3.2"
    container_name: db
    volumes:
      - db:/var/lib/mysql
    # If you want to connect to the Database pick your host port to map it to, (host-port:container-port) below. 
    #ports:
    #  - "3306:3306"  
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_USER=${MARIADB_USER:-evemu}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-evemu}

volumes:
  db:
  server_cache:
  image_cache:

