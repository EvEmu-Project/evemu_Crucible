name: A01 Isolated MariaDB Staging Validation

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/staging-a01.yml'
      - 'docker-compose.a01.yml'
      - 'tools/staging/**'
      - 'sql/staging/**'
      - 'docs/A01_STAGING_HARNESS.md'
  workflow_dispatch:
    inputs:
      full_server_smoke:
        description: 'Opt-in: also build and start the actual EVEmu server on a fresh disposable SDE'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  isolated-mariadb-fixture:
    name: MariaDB 11.8 two-character fixture + snapshot diff
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Python unit safety checks
        run: python3 -m unittest discover -s tools/staging/tests -v
      - name: Prepare unique isolated project
        run: python3 tools/staging/a01.py init --project evemu-a01-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start internal-only database
        run: python3 tools/staging/a01.py up
      - name: Real MariaDB synthetic integration smoke
        run: python3 tools/staging/a01.py selftest
      - name: Store safe synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a01-synthetic-fixture-report
          path: .a01/runs/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy ONLY this CI staging project
        if: always()
        run: |
          docker compose -p evemu-a01-ci-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client down --volumes --remove-orphans

  optional-real-server-smoke:
    name: Opt-in real server container startup
    if: github.event_name == 'workflow_dispatch' && inputs.full_server_smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Create fresh session
        run: python3 tools/staging/a01.py init --project evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and launch full SDE-backed server
        run: python3 tools/staging/a01.py up --server
      - name: Verify server is still running after initialization
        run: |
          # Installation may take several minutes. The DB must be usable and
          # the server must eventually open the Crucible game port.
          for i in $(seq 1 90); do
            if ! docker compose -p evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client ps --status running --services | grep -qx server; then
              echo 'Staging server container exited; check logs' >&2
              docker compose -p evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client logs --tail=150 server
              exit 1
            fi
            if bash -c 'echo > /dev/tcp/127.0.0.1/26000' 2>/dev/null; then
              echo 'PASS: isolated EVEmu server accepts local TCP on 26000'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: server did not open port 26000 during the startup window' >&2
          docker compose -p evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client logs --tail=150 server
          exit 1
      - name: Collect server startup evidence (private to CI run)
        if: always()
        run: |
          mkdir -p .a01/runs
          docker compose -p evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client ps -a > .a01/runs/containers.txt || true
          docker compose -p evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client logs --no-color --tail=250 server > .a01/runs/server-startup.log 2>&1 || true
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a01-server-startup
          path: |
            .a01/runs/server-startup.log
            .a01/runs/containers.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy ONLY this CI staging project
        if: always()
        run: docker compose -p evemu-a01-srv-${{ github.run_id }}-${{ github.run_attempt }} -f docker-compose.a01.yml --profile client down --volumes --remove-orphans
